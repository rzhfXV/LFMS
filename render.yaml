services:
  - type: web
    name: lfms-backend
    env: docker
    dockerfilePath: BackendLFMS/Dockerfile
    dockerContext: BackendLFMS
    plan: free
    region: singapore
    healthCheckPath: /api/categories
    envVars:
      - key: PORT
        value: 10000
      - key: DB_URL
        sync: false # Set your Supabase JDBC URL in Render dashboard
      - key: DB_USERNAME
        sync: false # postgres or pooler username
      - key: DB_PASSWORD
        sync: false # your Supabase password
      - key: JWT_SECRET
        sync: false # 256-bit base64 secret
      - key: CORS_ORIGINS
        sync: false # e.g. https://your-project.pages.dev
      - key: ADMIN_EMAIL
        value: admin@lfms.id
      - key: ADMIN_PASSWORD
        sync: false
