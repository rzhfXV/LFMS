# ============================================================
# Application
# ============================================================
spring.application.name=LFMS Backend

# ============================================================
# Server
# ============================================================
server.port=${PORT:8080}

# ============================================================
# Database (PostgreSQL / Supabase) - override via environment variables
# ============================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/postgres?sslmode=require}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================================================
# JPA / Hibernate
# ============================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ============================================================
# JWT Configuration
# ============================================================
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ============================================================
# File Upload
# ============================================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=${UPLOAD_DIR:uploads}
app.upload.allowed-extensions=jpg,jpeg,png,webp
app.upload.max-size-bytes=5242880

# ============================================================
# Rate Limiting (login attempts)
# ============================================================
app.rate-limit.login.capacity=5
app.rate-limit.login.refill-tokens=5
app.rate-limit.login.refill-minutes=15

# ============================================================
# CORS
# ============================================================
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}

# ============================================================
# Logging
# ============================================================
logging.level.id.rzhf.projecti=INFO
logging.level.org.springframework.security=WARN

# ============================================================
# Admin Default Seed (override via env vars)
# ============================================================
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
